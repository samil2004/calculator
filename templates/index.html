<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculator</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="calculator">

    <!-- Display -->

    <div class="display">

        <div id="previous"></div>

        <div id="display">0</div>

    </div>


    <!-- Buttons -->

    <div class="buttons">

        <!-- Top row -->

        <button
            class="top"
            onclick="clearDisplay()"
        >
            AC
        </button>

        <button
            class="top"
            onclick="deleteNumber()"
        >
            ⌫
        </button>

        <button
            class="top"
            onclick="percentage()"
        >
            %
        </button>

        <button
            class="operator"
            onclick="chooseOperator('/')"
        >
            ÷
        </button>


        <!-- 7 8 9 -->

        <button onclick="appendNumber('7')">
            7
        </button>

        <button onclick="appendNumber('8')">
            8
        </button>

        <button onclick="appendNumber('9')">
            9
        </button>

        <button
            class="operator"
            onclick="chooseOperator('*')"
        >
            ×
        </button>


        <!-- 4 5 6 -->

        <button onclick="appendNumber('4')">
            4
        </button>

        <button onclick="appendNumber('5')">
            5
        </button>

        <button onclick="appendNumber('6')">
            6
        </button>

        <button
            class="operator"
            onclick="chooseOperator('-')"
        >
            −
        </button>


        <!-- 1 2 3 -->

        <button onclick="appendNumber('1')">
            1
        </button>

        <button onclick="appendNumber('2')">
            2
        </button>

        <button onclick="appendNumber('3')">
            3
        </button>

        <button
            class="operator"
            onclick="chooseOperator('+')"
        >
            +
        </button>


        <!-- 0 . = -->

        <button
            class="zero"
            onclick="appendNumber('0')"
        >
            0
        </button>

        <button onclick="appendNumber('.')">
            .
        </button>

        <button
            class="equal"
            onclick="calculate()"
        >
            =
        </button>

    </div>

</div>


<script src="/static/script.js"></script>

</body>

</html>
